# Multi-Axis Audit Catalog
# 9 大カテゴリ 75 軸の監査軸定義。
# 各軸は SKILL.md / prompts/axis-auditor-prompt.md から参照され、
# `--all` / `--top10` / `Cn` / `M-NNN` / `--tags` / `--filter` / `--exclude-tags` で選択される。
#
# scores: U = uniqueness (既存軸では出ない度合い 1-5)
#         I = impact (検出時 finding の重要度 1-5)
#         E = executability (agent prompt 実行容易度 1-5)
# tags:   web / api / batch / datapipe / infra / ml / llm-app / llm-dev / cli / all
# recommended_agent_type: ~/.claude/agents/ に該当が無ければ general-purpose にフォールバック
#                         (config.yml の subagent_overrides で上書き可能)

version: "1.0.0"

# §10.1 TOP 10 推奨軸 (--top10 起動時に使用)
top10:
  - M-042  # Tacit Assumption (単位/順序/一意性)
  - M-060  # Negative Space / 不在監査
  - M-008  # Fail-Safe vs Fail-Secure 明示
  - M-068  # Prompt Injection 耐性
  - M-069  # Excessive Agency / Tool Whitelist
  - M-053  # Data Lineage / Provenance
  - M-054  # Ergodicity Audit (Path vs Ensemble)
  - M-011  # Iatrogenics / 防御の逆効果
  - M-014  # Fail Philosophy 一貫性
  - M-026  # Second-Order Effects / 介入カスケード

# 大カテゴリ定義
categories:
  C1: { name: "Security & Privacy", count: 6 }
  C2: { name: "Reliability & Operability", count: 20 }
  C3: { name: "Performance & Scale", count: 4 }
  C4: { name: "Code Quality & Maintainability", count: 12 }
  C5: { name: "UX / a11y / i18n", count: 10 }
  C6: { name: "Data Integrity & Lineage", count: 3 }
  C7: { name: "Supply Chain & Build", count: 3 }
  C8: { name: "Meta Audit / 思考方法", count: 9 }
  C9: { name: "LLM Agent 駆動開発リスク", count: 8 }

# 75 軸定義 (spec §4.1-§4.9 順)
axes:

  # ============================================================
  # C1 Security & Privacy (6 軸)
  # ============================================================

  - id: M-001
    name: "AuthN / AuthZ + OWASP Top 10"
    category: C1
    original_id: A3
    tags: [web, api, llm-app]
    scores: { U: 2, I: 5, E: 5 }
    focus: "認証・認可・OWASP A01-A10 の典型欠陥 (IDOR / SSRF / SQLi / XSS / CSRF / step-up)"
    relationship: "既存軸 (baseline)"
    recommended_agent_type: security-reviewer
    prompt_skeleton: |
      認証 / 認可 / OWASP Top 10 観点で {target_paths} を監査。endpoint ごとに
      (a) 認証必須か (b) ロール / リソース所有者 check (c) input validation
      (d) output encoding (e) rate limit (f) audit log の有無を表で出せ。
      step-up が必要な destructive 操作の欠落も指摘。

  - id: M-002
    name: "Multi-tenant / Cross-User Data Leakage"
    category: C1
    original_id: L1-3
    tags: [web, api]
    scores: { U: 4, I: 5, E: 4 }
    focus: "per-row authz、IDOR、WHERE user_id=? の漏れ"
    relationship: "M-001 の subset だが「全クエリで tenant filter が付くか」という横断視点で独立"
    recommended_agent_type: security-reviewer
    prompt_skeleton: |
      全 DB クエリ / ORM 呼び出しを列挙し、tenant_id / user_id / account_id 等の
      scope 列が WHERE に必ず入るか確認。入っていない経路を「IDOR risk」として
      挙げ、API endpoint との対応表を出せ。filter を service 層に集約する
      helper があるか、bypass 経路 (admin / system task) はどう区別されているか。

  - id: M-003
    name: "Immutable Audit Trail / Tamper-Evident Logging"
    category: C1
    original_id: L1-1
    tags: [api, llm-app, infra]
    scores: { U: 5, I: 4, E: 3 }
    focus: "app プロセス / DBA が事後改竄できないログ構造 (append-only / hash chain / WORM)"
    relationship: "独立 (既存 audit_log は emit のみ、tamper-evidence は別問題)"
    recommended_agent_type: security-reviewer
    prompt_skeleton: |
      audit_event / audit_log 系テーブルの schema を確認し、UPDATE/DELETE 経路が
      app コードから到達可能か grep。append-only か、外部 WORM (S3 Object Lock /
      CloudWatch immutable) に sink しているか。事故 / 訴訟時に「app 管理者が
      改竄していない」を示せる構造かを評価せよ。

  - id: M-004
    name: "Red Team / Adversarial Path Walk"
    category: C1
    original_id: RED
    tags: [web, api, llm-app]
    scores: { U: 3, I: 5, E: 4 }
    focus: "攻撃者視点で最も「お得な」侵入経路を 5 つ"
    relationship: "既存軸"
    recommended_agent_type: security-reviewer
    prompt_skeleton: |
      外部攻撃者 / 内部低権限ユーザー / 漏洩した token 保持者 の 3 persona で
      「最もコスト効率の良い攻撃 5 種」を列挙。前提条件 / 必要ツール / 期待戻り
      / 検知可能性 / 緩和策 を 1 件ずつ。OWASP 教科書通りでなく実装文脈に即せ。

  - id: M-005
    name: "Regulatory & Compliance Mapping"
    category: C1
    original_id: REG
    tags: [api, llm-app, all]
    scores: { U: 3, I: 4, E: 3 }
    focus: "業界規制 (GDPR / 金商法 / HIPAA / GxP / AI Act) と実装の対応"
    relationship: "既存軸"
    recommended_agent_type: security-reviewer
    prompt_skeleton: |
      対象業界の主要規制 (PJ context に応じる) と、データ保持期間 / 同意取得 /
      削除権 / 監査ログ / 説明可能性 の対応表を出力。実装側で satisfied / partial
      / missing を明記。partial / missing は具体的修正タスクを起票せよ。

  - id: M-006
    name: "Sensitive Data Disclosure via Logs / Errors"
    category: C1
    original_id: L5-6+RED
    tags: [all]
    scores: { U: 3, I: 4, E: 5 }
    focus: "stack trace / PII / secret が log / error response に漏出"
    relationship: "M-001 の補完、M-045 と並存"
    recommended_agent_type: security-reviewer
    prompt_skeleton: |
      Exception handler / logger 呼び出し / error response builder を列挙し、
      (a) raw exception を user に返していないか (b) PII / secret / token を
      log にそのまま出していないか (c) structlog の bind に sensitive key が
      入っていないか を表で出せ。leak risk が高い順に並べよ。

  # ============================================================
  # C2 Reliability & Operability (20 軸)
  # ============================================================

  - id: M-007
    name: "SRE 3AM Oncall Walk-through"
    category: C2
    original_id: SRE
    tags: [api, batch, infra, llm-app]
    scores: { U: 3, I: 5, E: 4 }
    focus: "3AM oncall が runbook / dashboard / log だけで復旧できるか"
    relationship: "既存軸"
    recommended_agent_type: code-reviewer
    prompt_skeleton: |
      3AM に「サービス停止」alert を受けた oncall を想定し、(a) どの dashboard
      を見るか (b) どの log query を打つか (c) どの runbook がヒットするか (d)
      どの操作で復旧するか の 4 ステップを実コマンドレベルで書け。書けない箇所
      が「ある」のがバグ。

  - id: M-008
    name: "Fail-Safe vs Fail-Secure 設計の明示"
    category: C2
    original_id: L1-2
    tags: [api, batch, infra, ml]
    scores: { U: 5, I: 5, E: 3 }
    focus: "障害時に「止まる」「続ける」「縮退する」の選択が明文化されているか"
    relationship: "独立 (機能安全領域からの import、SaaS では未浸透)"
    recommended_agent_type: code-reviewer
    prompt_skeleton: |
      external dependency (DB / cache / external API / queue / auth) ごとに
      「障害時にどう振る舞うか」を表化。fail-open (素通し) / fail-closed (拒否)
      / fail-degrade (縮退) の選択を、ビジネス要件と整合しているか評価せよ。
      明文化されていない選択を「暗黙 fail philosophy」として指摘。

  - id: M-009
    name: "Graceful Degradation / Brown-Out 設計"
    category: C2
    original_id: L1-6
    tags: [web, api, infra]
    scores: { U: 4, I: 4, E: 3 }
    focus: "部分障害時の段階的縮退 (load shedding / read-only mode / feature flag kill)"
    relationship: "M-008 の dynamic 版"
    recommended_agent_type: code-reviewer
    prompt_skeleton: |
      「重要度 S/A/B/C」の機能分類を再構成し、過負荷時 / partial outage 時に
      C → B → A の順で機能を落とす機構があるか確認。circuit breaker / load
      shedder / read-only flag / feature kill の有無、orchestration の場所を示せ。

  - id: M-010
    name: "Human-in-the-Loop / Override / Kill Switch"
    category: C2
    original_id: L1-8
    tags: [api, batch, ml, llm-app]
    scores: { U: 4, I: 5, E: 4 }
    focus: "自動化が暴走した時、人間が独立経路で止められるか"
    relationship: "独立 (M-008 と相補、止め方の保証)"
    recommended_agent_type: code-reviewer
    prompt_skeleton: |
      自動的に副作用を起こす経路 (auto-execute / scheduled / agent loop / retry
      daemon) を列挙し、それぞれに (a) 人間が止める手段 (b) その手段が同じ
      サービス bug に巻き込まれないか (c) kill 後の半端な state の片付け
      を評価。kill switch が同じ DB / 同じ process に依存しているなら指摘。

  - id: M-011
    name: "Iatrogenics / 防御の逆効果"
    category: C2
    original_id: L3-2
    tags: [api, infra]
    scores: { U: 5, I: 4, E: 4 }
    focus: "retry storm / alert fatigue / HA そのものの SPOF 化"
    relationship: "独立 (高ユニーク)"
    recommended_agent_type: code-reviewer
    prompt_skeleton: |
      「防御のための仕組み」を列挙 (retry / circuit breaker / HA / replication /
      rate limit / alerting / 監視)。それぞれが「導入していなければ起きなかった
      種類の事故」を 1 件想像し、現実的に起こり得るかを評価。retry の指数 backoff
      / jitter / 上限、alert の SLO 連動 / dedup を check。

  - id: M-012
    name: "Hidden SPOF"
    category: C2
    original_id: L3-3
    tags: [api, infra, ml]
    scores: { U: 4, I: 5, E: 3 }
    focus: "TLS cert / DNS / 鍵管理 / 1 つの 3rd party / bus factor の単一障害点"
    relationship: "M-040 と部分相互参照"
    recommended_agent_type: code-reviewer
    prompt_skeleton: |
      「これが今日止まったら全機能停止」になる依存を 10 個 brainstorm。TLS cert
      / DNS provider / OAuth IdP / external API / cron host / 暗号鍵 (KMS / env)
      / 単一 region / 単一 maintainer。失効・rotation 手順の有無、SPOF を解消する
      コストと benefit を表化せよ。

  - id: M-013
    name: "Antifragility / ストレス下成長"
    category: C2
    original_id: L3-5
    tags: [api, infra]
    scores: { U: 5, I: 3, E: 2 }
    focus: "chaos drill / game day / postmortem → test 還元のループ"
    relationship: "独立 (高ユニーク、メタ思考必要)"
    recommended_agent_type: code-reviewer
    prompt_skeleton: |
      過去 N 回の incident / postmortem を列挙し、それぞれが (a) 新しい test に
      なったか (b) chaos drill に組み込まれたか (c) playbook に reflect されたか
      を check。「同じ事故を 2 回起こさない構造」が成立しているかを評価せよ。

  - id: M-014
    name: "Fail Philosophy 一貫性"
    category: C2
    original_id: L3-9
    tags: [all]
    scores: { U: 5, I: 4, E: 3 }
    focus: "沈黙の失敗 / 騒がしい失敗 の選択が業界文脈と一貫しているか"
    relationship: "M-008 と相補、A1 silent-failure の延長"
    recommended_agent_type: silent-failure-hunter
    prompt_skeleton: |
      failure mode を「silent (落とさない)」「loud (落とす)」「degrade (縮退)」
      の 3 分類で全 critical path を分類。業界 (金融 / 医療 / 広告 / ゲーム) の
      文脈で適切な選択になっているか評価。silent と loud が混在し一貫性を欠く
      経路を指摘せよ。

  - id: M-015
    name: "SLO / SLI / Error Budget 設計"
    category: C2
    original_id: L4-2
    tags: [api, web, infra]
    scores: { U: 3, I: 4, E: 4 }
    focus: "user-facing SLI か内部 metric か、error budget の運用"
    relationship: "M-021 (Goodhart) と相補"
    recommended_agent_type: code-reviewer
    prompt_skeleton: |
      既存の SLO / SLI を列挙し、それぞれが (a) user-facing か (b) 計測点が正しいか
      (c) error budget の消費を可視化しているか (d) budget 枯渇時の意思決定が
      document 化されているか を表で出せ。

  - id: M-016
    name: "Alert Quality / Alert Fatigue"
    category: C2
    original_id: L4-5
    tags: [api, infra]
    scores: { U: 4, I: 4, E: 4 }
    focus: "alert → action rate、symptom vs cause、夜間に鳴る価値"
    relationship: "M-007 / M-011 と相補"
    recommended_agent_type: code-reviewer
    prompt_skeleton: |
      全 alert / notification 定義を列挙し、過去 N 件で (a) 発火 → action 率
      (b) false positive 率 (c) symptom-based か cause-based か (d) 夜間に
      鳴って人を起こす価値があるか を評価。低品質 alert を kill / mute / 統合
      すべきものとして提案。

  - id: M-017
    name: "Configuration Drift / Environment Parity"
    category: C2
    original_id: L1-7
    tags: [api, infra, batch]
    scores: { U: 4, I: 5, E: 4 }
    focus: "dev / staging / prod の意図的 vs 事故的差異、env / compose / IaC の wiring shadow"
    relationship: "PJ 経験 (compose env shadow) の一般化"
    recommended_agent_type: code-reviewer
    prompt_skeleton: |
      config source を全列挙 (env / .env / docker-compose / IaC / runtime override
      / secret manager)。同じ key が複数 source に出る場合、resolution 順序と
      「どこに書くと届くか」を表化。CI で source 間の整合性を gate しているか、
      shadow しているケースを grep で抽出。

  - id: M-018
    name: "TOCTOU / Stale State Decision"
    category: C2
    original_id: L1-5
    tags: [api, batch]
    scores: { U: 4, I: 5, E: 4 }
    focus: "check → act の間で前提状態が変わる経路"
    relationship: "A2 race の subset として明示 (A2 = ロック / 並行、M-018 = 時間差判断)"
    recommended_agent_type: code-reviewer
    prompt_skeleton: |
      「if X then mutate Y」型のコードを grep。check と mutate の間に await /
      network / IO / 他 task の介入余地があるか確認。SELECT → UPDATE が
      単一 tx でない / 楽観ロック未使用 / 状態 column の row-level check 欠落
      を指摘。最低 5 件抽出。

  - id: M-019
    name: "Race Conditions / Concurrency"
    category: C2
    original_id: A2
    tags: [api, batch]
    scores: { U: 3, I: 5, E: 5 }
    focus: "ロック粒度 / 二重発火 / async cancel / signal handler"
    relationship: "既存軸 (M-018 は subset)"
    recommended_agent_type: code-reviewer
    prompt_skeleton: |
      共有資源 (DB row / file / cache / in-memory dict / external API limit) を
      列挙し、それぞれに対する concurrent access の保護を表化。lock の粒度 /
      公平性 / re-entrancy / dead-lock 可能性 / cancellation safety を評価。

  - id: M-020
    name: "Silent Failure / Swallowed Exception"
    category: C2
    original_id: A1
    tags: [all]
    scores: { U: 3, I: 5, E: 5 }
    focus: "except: pass / 無条件 catch / 失敗を成功に変える経路"
    relationship: "既存軸 (M-014 と相補)"
    recommended_agent_type: silent-failure-hunter
    prompt_skeleton: |
      try/except / .catch / err != nil で error を握り潰している箇所を全列挙。
      それぞれが (a) intentional か (b) 監視 emit があるか (c) 上位 caller に
      失敗を伝えているか (d) retry / DLQ にルーティングされるか を表で評価。

  - id: M-021
    name: "Goodhart's Law / Metric Capture"
    category: C2
    original_id: L3-1
    tags: [all]
    scores: { U: 5, I: 3, E: 2 }
    focus: "指標が目標化して本質と乖離 (e.g., test カバレッジ / latency p50)"
    relationship: "M-015 と相補"
    recommended_agent_type: code-reviewer
    prompt_skeleton: |
      プロジェクトで「目標値」として運用される metric を列挙し、それぞれが
      (a) 本来の意図 (b) hack 可能な抜け穴 (c) 既に hack されていないか の 3
      点で評価。test カバレッジ / SLO / 売上 / engagement 等が gaming されて
      本質的価値を毀損していないか具体例で示せ。

  - id: M-022
    name: "Temporal Coupling / Lifecycle Order"
    category: C2
    original_id: L2-7
    tags: [api, batch]
    scores: { U: 4, I: 4, E: 4 }
    focus: "呼び出し順序の暗黙契約 (init → register → start)"
    relationship: "既存 A8 lifecycle の DDD 視点拡張"
    recommended_agent_type: code-reviewer
    prompt_skeleton: |
      lifecycle (startup / shutdown / hot-reload / migration) で「呼び出し順序」
      に依存する箇所を列挙。順序が code comment / docstring に明示されているか、
      順序違反時に型 / runtime で検出できるか評価。順序が暗黙の箇所を bug
      発火源として指摘せよ。

  - id: M-023
    name: "CI/CD Health + Test Erosion"
    category: C2
    original_id: L4-6
    tags: [all]
    scores: { U: 3, I: 4, E: 4 }
    focus: "CI 時間 / flaky / skip 蓄積 / --no-verify"
    relationship: "M-040 と相補"
    recommended_agent_type: code-reviewer
    prompt_skeleton: |
      最近 N 回の CI run を見て (a) 平均時間 (b) flaky test 上位 (c) skip / xfail
      の蓄積 (d) --no-verify commit 履歴 (e) main 直 push の有無 を集計。
      CI が「形だけ」になっていないかを評価。

  - id: M-024
    name: "Deployment Maturity / Rollback Capability"
    category: C2
    original_id: L4-7
    tags: [api, infra]
    scores: { U: 4, I: 5, E: 3 }
    focus: "rollback drill が行われているか、reversible migration か"
    relationship: "M-007 と相補"
    recommended_agent_type: code-reviewer
    prompt_skeleton: |
      最近 N 回の deploy で (a) rollback された数 (b) rollback 手順が実行可能か
      (c) DB migration が reversible か (d) feature flag で kill 可能か を表化。
      「rollback したことがない」=「できる保証がない」前提で評価せよ。

  - id: M-025
    name: "DORA 4 Metrics 健全性"
    category: C2
    original_id: L4-1
    tags: [all]
    scores: { U: 3, I: 3, E: 4 }
    focus: "deploy freq / lead time / CFR / MTTR"
    relationship: "M-015 / M-021 と相補"
    recommended_agent_type: code-reviewer
    prompt_skeleton: |
      過去 N ヶ月の deploy 頻度 / lead time / change failure rate / MTTR を
      概算。State of DevOps Elite / High / Medium / Low のどこに位置するか、
      bottleneck が code review / CI / approval / rollback どこにあるかを示せ。

  - id: M-026
    name: "Second-Order Effects / 介入カスケード"
    category: C2
    original_id: L3-6
    tags: [all]
    scores: { U: 5, I: 4, E: 2 }
    focus: "修正 A が B を誘発する連鎖、過去事例"
    relationship: "M-067 (loop topology) と並存・補完"
    recommended_agent_type: code-reviewer
    prompt_skeleton: |
      最近 N 件の bug fix / 機能追加で「fix によって新たに起きた問題」を列挙。
      カスケード経路 (A → B → C) を図示。fix 検討時に second-order effect を
      routine で考える process があるか評価せよ。

  # ============================================================
  # C3 Performance & Scale (4 軸)
  # ============================================================

  - id: M-027
    name: "Performance & Algorithmic Complexity"
    category: C3
    original_id: A7
    tags: [all]
    scores: { U: 3, I: 4, E: 5 }
    focus: "O(N²) / N+1 / N の見積もり違い"
    relationship: "既存軸"
    recommended_agent_type: performance-optimizer
    prompt_skeleton: |
      hot path / loop / DB クエリで N の最悪見積もりを評価。N+1 / O(N²) / cache
      miss / 大きい payload / 同期 IO in async path を列挙。production の N の
      最悪値で latency / cost / memory を見積もれ。

  - id: M-028
    name: "Database Schema / Index / Query Plan"
    category: C3
    original_id: A4
    tags: [api, batch, datapipe]
    scores: { U: 3, I: 5, E: 5 }
